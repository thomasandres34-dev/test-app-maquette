<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TCMV</title>
<link rel="apple-touch-icon" href="assets/tcmv-app-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
// Téléphone = écran tactile dont le petit côté fait ≤ 540 px (quelle que soit l'orientation)
(function(){ var m = Math.min(screen.width, screen.height) <= 540 && ('ontouchstart' in window || navigator.maxTouchPoints > 0); if (m) document.documentElement.classList.add('mob'); })();
try { localStorage.setItem('tcmv.accounts.cur', 'demo'); } catch (e) {}
</script>
<style>
html,body{touch-action:manipulation;margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px;box-sizing:border-box;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:14px;max-width:280px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-0.04em}
p{margin:0;font-size:15px;line-height:1.45;font-weight:500;color:rgba(255,255,255,0.6)}
a.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:15px;text-decoration:none}
a.btn.alt{background:rgba(255,255,255,0.1);color:#fff}
.phone{width:470px;height:1012px;flex:none;transform-origin:center center}
.phone iframe{width:470px;height:1012px;border:0;display:block;background:transparent}
html.mob,html.mob body{background:#000;overflow:hidden}
html.mob .side{display:none!important}
html.mob .wrap{padding:0;display:block}
html.mob .phone{position:fixed;top:0;left:0;width:100%;height:100vh;margin:0!important;transform-origin:center center}
html.mob .phone iframe{width:100%;height:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h1>TCMV</h1>
    <p>Aperçu interactif · connecté en tant que Thomas (admin).</p>
    <a class="btn" href="./Final%20App%20Plateforme.dc.html" target="app">App</a>
    <a class="btn alt" href="./Final%20Espace%20Coach.dc.html" target="_blank">Espace Coach</a>
    <p>Les données sont stockées dans ce navigateur uniquement.</p>
  </div>
  <div class="phone"><iframe name="app" src="./Final%20App%20Plateforme.dc.html" allow="autoplay; clipboard-write; web-share"></iframe></div>
</div>
<script>
(function(){
  const ph = document.querySelector('.phone'), de = document.documentElement, mob = de.classList.contains('mob');
  const fit = () => {
    const W = innerWidth, H = innerHeight;
    if (mob) {
      if (W > H) {
        // Téléphone couché : on contre-pivote l'app pour qu'elle reste verticale
        const a = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 90);
        const rot = (a === 270 || a === -90) ? 90 : -90;
        Object.assign(ph.style, { width: H + 'px', height: W + 'px', left: (W - H) / 2 + 'px', top: (H - W) / 2 + 'px', transform: 'rotate(' + rot + 'deg)' });
      } else {
        const sa = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        const HH = sa ? Math.max(screen.height, H) : H;
        Object.assign(ph.style, { width: '100%', height: HH + 'px', left: '0', top: '0', transform: '' });
      }
      return;
    }
    const k = Math.min(1, (H - 24) / 1012);
    ph.style.transform = 'scale(' + k + ')';
    ph.style.margin = (-(1012 * (1 - k)) / 2) + 'px ' + (-(470 * (1 - k)) / 2) + 'px';
  };
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => { fit(); setTimeout(fit, 150); setTimeout(fit, 500); });
  if (screen.orientation) screen.orientation.addEventListener('change', fit);
  fit();
  const lock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (e) {} };
  lock(); addEventListener('touchend', lock, { once: true });
})();
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
