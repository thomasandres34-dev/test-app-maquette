<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
<style>@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}body{margin:0;background:#1c1c1c;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#fff}a:hover{color:#bdbdbd}</style>
</helmet>
<div data-screen-label="Nav barre" style="position:relative;width:100%;height:100%;min-height:124px;overflow:visible">
  <sc-if value="{{ isDemo }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 30% 100%,#3a4a52 0%,#1b2226 55%,#111 100%)"></div>
  </sc-if>
  <div ref="{{ barRef }}" style="position:absolute;left:10px;right:10px;bottom:28px;height:68px;border-radius:999px;transform-origin:50% 60%;will-change:transform">
    <div style="position:absolute;inset:0;border-radius:999px;pointer-events:none;background:rgba(0,0,0,0.23);backdrop-filter:blur(10px) saturate(1.6);-webkit-backdrop-filter:blur(10px) saturate(1.6);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.12)"></div>
    <div style="position:absolute;inset:0;border-radius:999px;overflow:hidden;pointer-events:none"><div ref="{{ glowRef }}" style="position:absolute;top:0;left:0;width:{{ segW }};height:100%;will-change:transform"><div ref="{{ glowInRef }}" style="position:absolute;left:-90%;right:-90%;top:-110%;bottom:-110%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,0.26) 0%,rgba(255,255,255,0.16) 30%,rgba(255,255,255,0.07) 60%,rgba(255,255,255,0) 100%);opacity:0;transition:opacity .2s ease"></div></div></div>
    <div style="position:absolute;inset:0;border-radius:999px;padding:1.2px;pointer-events:none;overflow:hidden;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)"><div ref="{{ rimRef }}" style="position:absolute;top:0;left:0;width:{{ segW }};height:100%;will-change:transform"><div ref="{{ rimInRef }}" style="position:absolute;left:-60%;right:-60%;top:-60%;bottom:-60%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,0.95) 0%,rgba(255,255,255,0.5) 40%,rgba(255,255,255,0) 100%);opacity:0;transition:opacity .2s ease"></div></div></div>
    <div ref="{{ trackRef }}" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" onLostPointerCapture="{{ up }}" style="position:relative;height:100%;display:grid;grid-template-columns:repeat({{ segN }},minmax(0,1fr));touch-action:none;user-select:none;-webkit-user-select:none">
      <div ref="{{ bubRef }}" style="position:absolute;top:0;left:0;width:{{ segW }};height:100%;pointer-events:none;will-change:transform"><div ref="{{ pillRef }}" style="position:absolute;top:4px;bottom:4px;left:4px;right:4px;border-radius:999px;background:{{ pillBg }};box-shadow:{{ pillSh }};transition:transform .35s cubic-bezier(.2,.7,.2,1),background .25s ease"></div></div>
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ t.onKey }}" aria-label="{{ t.label }}" aria-current="{{ t.current }}" style="position:relative;height:100%;border:none;outline:none;background:transparent;color:{{ t.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;transition:color .4s ease">
          <sc-if value="{{ t.isProgrammes }}" hint-placeholder-val="{{ false }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="{{ t.fill }}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="2.6"></rect><path d="M6 5.8h12" fill="none"></path><path d="M8.3 2.8h7.4" fill="none"></path></svg></sc-if>
          <sc-if value="{{ t.isComm }}" hint-placeholder-val="{{ false }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="{{ t.fill }}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 3.7 5.5 3.7 9s-1.2 6.5-3.7 9c-2.5-2.5-3.7-5.5-3.7-9S9.5 5.5 12 3z" fill="none"></path></svg></sc-if>
          <sc-if value="{{ t.isCoaching }}" hint-placeholder-val="{{ false }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="{{ t.fill }}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2.6 5.6 12.9c-.4.5 0 1.1.6 1.1H11l-1.1 7.1c-.1.6.6.9 1 .4l7.6-10.2c.4-.5 0-1.2-.6-1.2H13l1.4-7.1c.1-.6-.6-.9-1-.4z"></path></svg></sc-if>
          <sc-if value="{{ t.isAthlete }}" hint-placeholder-val="{{ false }}"><svg width="25" height="25" viewBox="0 0 24 24" fill="{{ t.fill }}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.6" r="4"></circle><path d="M4.3 19.6c0-3.7 3.4-6.3 7.7-6.3s7.7 2.6 7.7 6.3c0 .6-.5 1-1 1H5.3c-.6 0-1-.4-1-1z"></path></svg></sc-if>
          <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap">{{ t.label }}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:124},&quot;tab&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(index: number) =&amp;gt; void&quot;},&quot;navStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Verre gris&quot;,&quot;Pilule blanche&quot;],&quot;default&quot;:&quot;Verre gris&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;navFilled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;}}">
const LABELS = ['Programmes', 'Club', 'Aujourd\u2019hui', 'Profil'];
const EASE = 'cubic-bezier(.2,.7,.2,1)', KF = 'cubic-bezier(.45,0,.25,1)';
const GROW = 'scale(1.14,1.236)';
const LAND_TAP = [[0, 'scale(1)'], [0.15, GROW], [0.27, 'scale(1.1,1.186)'], [0.42, 'scale(1.08,0.97)'], [0.62, 'scale(1.02,1.01)'], [0.82, 'scale(1,0.998)'], [1, 'scale(1)']];
const LAND_DRAG = [[0, GROW], [0.32, 'scale(1.08,0.97)'], [0.62, 'scale(1.02,1.01)'], [0.82, 'scale(1,0.998)'], [1, 'scale(1)']];

class Component extends DCLogic {
  state = { tab: this.props.tab ?? 2, hover: null };
  barRef = React.createRef(); trackRef = React.createRef(); bubRef = React.createRef(); pillRef = React.createRef();
  glowRef = React.createRef(); glowInRef = React.createRef(); rimRef = React.createRef(); rimInRef = React.createRef();
  anims = []; timers = [];

  ids() { const o = this.props.only; return Array.isArray(o) && o.length ? o : [0, 1, 2, 3]; }
  pos(i) { return Math.max(0, this.ids().indexOf(i)); }
  componentDidMount() { this.setX(this.pos(this.state.tab) * 100, 'none'); }
  componentWillUnmount() { this.anims.forEach(a => a.cancel()); this.timers.forEach(clearTimeout); }

  movers() { return [this.bubRef.current, this.glowRef.current, this.rimRef.current].filter(Boolean); }
  setX(pct, tr) { this.movers().forEach(el => { if (tr != null) el.style.transition = tr; el.style.transform = 'translateX(' + pct + '%)'; }); }
  anim(el, kf, opt) { if (el && el.animate) this.anims.push(el.animate(kf, opt)); }
  land(fromDrag) {
    const p = this.pillRef.current; if (!p) return;
    p.getAnimations && p.getAnimations().forEach(a => a.cancel());
    p.style.transform = 'scale(1)';
    const fr = fromDrag ? LAND_DRAG : LAND_TAP;
    this.anim(p, fr.map(([offset, transform]) => ({ offset, transform, easing: KF })), { duration: fromDrag ? 520 : 720 });
  }
  press(on) { const b = this.barRef.current; if (!b) return; b.style.transition = on ? 'transform .22s ' + EASE : 'transform .45s cubic-bezier(.3,1.35,.5,1)'; b.style.transform = on ? 'scale(1.015,1.04)' : 'scale(1)'; }
  glow(on) {
    const els = [this.glowInRef.current, this.rimInRef.current].filter(Boolean);
    els.forEach(e => e.getAnimations && e.getAnimations().forEach(a => a.cancel()));
    if (on) { els.forEach(e => { e.style.transform = 'scale(1)'; e.style.opacity = '1'; }); return; }
    els.forEach(e => { e.style.opacity = '0'; });
    this.anim(this.glowInRef.current, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0.55, transform: 'scale(1.8,1.15)', offset: 0.45 }, { opacity: 0, transform: 'scale(2.8,1.3)' }], { duration: 520, easing: EASE });
    this.anim(this.rimInRef.current, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0.8, transform: 'scale(3,1)', offset: 0.4 }, { opacity: 0, transform: 'scale(7,1)' }], { duration: 620, easing: EASE });
  }
  follow(e) {
    const r = this.trackRef.current.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const ids = this.ids(), c = ids.length;
    this.setX(Math.max(0, Math.min((c - 1) * 100, (f * c - 0.5) * 100)));
    const i = ids[Math.min(c - 1, Math.floor(f * c))];
    if (i !== this.state.hover) this.setState({ hover: i });
  }
  select(i, fromDrag) {
    this.setX(this.pos(i) * 100, 'transform .6s ' + EASE);
    this.land(fromDrag);
    if (i !== this.state.tab) this.setState({ tab: i });
    this.props.onChange && this.props.onChange(i);
  }

  renderVals() {
    const OK = JSON.stringify(this.props.only || null); if (OK !== this._ok) { this._ok = OK; setTimeout(() => this.setX(this.pos(this.state.tab) * 100, 'none'), 0); }
    if (this.props.tab != null && this.props.tab !== this._propTab) { this._propTab = this.props.tab; if (this._propTab !== this.state.tab) setTimeout(() => this.select(this._propTab, false), 0); }
    const s = this.state, act = s.hover ?? s.tab;
    const glass = (this.props.navStyle ?? 'Verre gris') === 'Verre gris', allFill = glass && (this.props.navFilled ?? false);
    return {
      isDemo: this.props.demo ?? this.props.tab == null,
      barRef: this.barRef, trackRef: this.trackRef, bubRef: this.bubRef, pillRef: this.pillRef,
      glowRef: this.glowRef, glowInRef: this.glowInRef, rimRef: this.rimRef, rimInRef: this.rimInRef,
      pillBg: glass ? 'rgba(255,255,255,0.22)' : '#fff',
      pillSh: glass ? 'inset 0 0 0 0.5px rgba(255,255,255,0.35),inset 0 1px 0 rgba(255,255,255,0.3)' : 'none',
      segW: (100 / this.ids().length) + '%', segN: this.ids().length,
      tabs: this.ids().map(i => [LABELS[i], i]).map(([label, i]) => {
        const on = i === act, fill = allFill || on ? 'currentColor' : 'none';
        return { label, logoOp: on ? 1 : 0.7, logoFilter: (glass ? false : on) ? 'invert(1)' : 'none', isProgrammes: i === 0, isComm: i === 1, isCoaching: i === 2, isAthlete: i === 3,
          color: glass ? '#fff' : (on ? '#000' : '#fff'), fill, solid: fill === 'currentColor', outline: fill !== 'currentColor', calLine: fill === 'currentColor' ? 'rgba(0,0,0,0.45)' : 'currentColor', calDot: fill === 'currentColor' ? '#000' : 'currentColor',
          current: i === s.tab ? 'page' : undefined,
          onKey: (e) => { if (e.detail === 0) this.select(i, false); } };
      }),
      down: (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        this.drag = true; this.press(true); this.glow(true);
        const p = this.pillRef.current; if (p) { p.getAnimations && p.getAnimations().forEach(a => a.cancel()); p.style.transform = GROW; }
        this.movers().forEach(el => { el.style.transition = 'transform .14s ' + EASE; });
        this.follow(e);
        this.timers.push(setTimeout(() => { if (this.drag) this.movers().forEach(el => { el.style.transition = 'none'; }); }, 140));
      },
      move: (e) => { if (this.drag) this.follow(e); },
      up: () => {
        this.press(false);
        if (!this.drag) return;
        this.drag = false; this.glow(false);
        const i = this.state.hover ?? this.state.tab;
        this.setState({ hover: null });
        this.select(i, true);
      }
    };
  }
}
</script>
</body>
</html>
